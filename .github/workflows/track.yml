name: track pi releases

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Compare pinned and latest pi
        id: versions
        run: |
          echo "current=$(node -p 'require("./package.json").dependencies["@earendil-works/pi-ai"]')" >> "$GITHUB_OUTPUT"
          echo "latest=$(npm view @earendil-works/pi-ai version)" >> "$GITHUB_OUTPUT"
      - name: Upgrade pi and rerun key-free experiments
        if: steps.versions.outputs.current != steps.versions.outputs.latest
        run: |
          npm install --save-exact --ignore-scripts \
            @earendil-works/pi-ai@latest @earendil-works/pi-durable@latest @earendil-works/pi-codemode@latest \
            @earendil-works/pi-coding-agent@latest @earendil-works/chord@latest
          # Failed or changed experiments are the point of this run: report them in the PR instead of failing.
          npm run exp -- --offline --update --report report.md || true
      - name: Open a pull request with the report
        if: steps.versions.outputs.current != steps.versions.outputs.latest
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          # One branch for every release: a newer pi updates the open PR instead of opening another.
          branch: track/pi-latest
          title: "track: pi ${{ steps.versions.outputs.current }} -> ${{ steps.versions.outputs.latest }}"
          commit-message: "track: pi ${{ steps.versions.outputs.latest }}"
          body-path: report.md
          add-paths: |
            package.json
            package-lock.json
            experiments/*/snapshot.json
      # A PR opened by github-actions[bot] does start its pull_request CI run, but GitHub holds the run as
      # action_required until someone approves it, and the pending check blocks merging. Approve it here.
      - name: Approve CI on the pull request
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            ids=$(gh api "repos/${{ github.repository }}/actions/runs?branch=track/pi-latest&status=action_required" --jq '.workflow_runs[].id')
            if [ -n "$ids" ]; then
              for id in $ids; do gh api -X POST "repos/${{ github.repository }}/actions/runs/$id/approve"; done
              exit 0
            fi
            sleep 5
          done
          echo "::warning::No CI run waiting for approval; approve it on the pull request if CI is pending."
