name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-experiments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Key-free experiments match their snapshots
        run: npm run exp -- --offline --report report.md
      - if: always()
        run: cat report.md >> "$GITHUB_STEP_SUMMARY"
