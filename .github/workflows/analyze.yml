name: analyze tracking PR

# Runs the release analyst on a tracking PR's report and posts the result as a PR comment.
# Called by track.yml when a pi upgrade changed experiment results; can also be run by hand on any PR.
on:
  workflow_call:
    inputs:
      pr: { type: string, required: true }
      from: { type: string, required: true }
      to: { type: string, required: true }
  workflow_dispatch:
    inputs:
      pr: { description: "Pull request number", type: string, required: true }
      from: { description: "pi version before the upgrade, e.g. 1.0.2", type: string, required: true }
      to: { description: "pi version after the upgrade, e.g. 1.0.4", type: string, required: true }

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check for the DeepSeek key
        id: key
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::notice::DEEPSEEK_API_KEY is not set; skipping the analysis."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v7
      - if: steps.key.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - if: steps.key.outputs.present == 'true'
        run: npm ci --ignore-scripts
      - name: Analyze the PR's report and comment
        if: steps.key.outputs.present == 'true'
        run: |
          gh pr view "${{ inputs.pr }}" --json body --jq .body > report.md
          node analyst/analyze.ts --report report.md --from "${{ inputs.from }}" --to "${{ inputs.to }}" --out analysis
          node analyst/comment.ts analysis > comment.md
          gh pr comment "${{ inputs.pr }}" --body-file comment.md
